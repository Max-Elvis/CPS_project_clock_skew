; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = loopback

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps = coryjfowler/mcp_can@^1.5.1

[env:nodeA]
build_src_filter = -<*> +<node_tx/>
build_flags = -DNODE_A
upload_port = COM4
monitor_port = COM4

[env:nodeB]
build_src_filter = -<*> +<node_tx/>
build_flags = -DNODE_B
upload_port = COM5
monitor_port = COM5


# For testing purposes
[env:loopback]
build_src_filter = -<*> +<../src_bringup_loopback/>
upload_port = COM4
monitor_port = COM4

[env:sender]
build_src_filter = -<*> +<../src_bringup_sender/>
upload_port = COM5
monitor_port = COM5

[env:receiver]
build_src_filter = -<*> +<../src_bringup_receiver/>
upload_port = COM6
monitor_port = COM6
